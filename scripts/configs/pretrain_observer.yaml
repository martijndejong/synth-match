experiment:
  project_name: "SynthRLProject"
  group: "observer"
  run_name: "first_try_cutoff_adsr"

training:
  batch_size: 64
  epochs: 15
  val_fraction: 0.1
  num_samples: 500000

observer:
  learning_rate: 1e-4
  feature_dim: 128

data:
  # Relative to the location of pretrain_observer.py
  directory: "../data/labeled_spectrograms"
  tfrecord_filename: "SimpleSynthCutOffADSR.tfrecords"

model_saving:
  # Relative to the location of pretrain_observer.py
  base_dir: "../saved_models/observer"
