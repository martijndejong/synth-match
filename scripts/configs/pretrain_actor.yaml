experiment:
  project_name: "SynthRLProject"
  group: "actor"
  run_name: "pretrain_actor_cutoff_adsr"

training:
  batch_size: 64
  epochs: 5
  val_fraction: 0.1
  num_samples: 500000

observer:
  # Match the feature_dim so the Actor's input size remains consistent
  feature_dim: 128
  # If you have a trained observer weights file, place its path here (relative or absolute).
  # The script 'pretrain_actor.py' will load these weights and freeze them.
  pretrained_weights_path: "../saved_models/observer/20250203_1642_first_try_cutoff_adsr/observer_weights.h5"

data:
  # Same directory and TFRecord file as in 'pretrain_observer.yaml'
  directory: "../data/labeled_spectrograms"
  tfrecord_filename: "SimpleSynthCutOffADSR.tfrecords"

model_saving:
  # A new directory for saving actor pretraining results (parallel to the observer)
  base_dir: "../saved_models/actor"
